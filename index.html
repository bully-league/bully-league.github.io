<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Front Office</title>
<meta name="description" content="Live standings, rankings, and league news for The Front Office Madden league.">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Front Office">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="wordmark">
      <span class="wordmark-the">THE</span>
      <span class="wordmark-main">FRONT OFFICE</span>
    </div>
    <img class="topbar-crest" src="logo/crest-120.png" alt="Bully League" width="117" height="120">
  </div>
  <div class="week-chip" id="week-chip">—</div>
</header>

<div id="ios-hint" class="ios-hint" hidden>
  <div class="ios-hint-text">Install this app: tap <svg class="share-glyph" viewBox="0 0 24 24" width="15" height="15" fill="currentColor" style="vertical-align:-2px"><path d="M12 2l4 4h-3v9h-2V6H8zM5 10h4v2H7v9h10v-9h-2v-2h4a1 1 0 0 1 1 1v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V11a1 1 0 0 1 1-1z"/></svg> then <strong>Add to Home Screen</strong></div>
  <button class="ios-hint-close" id="ios-hint-close" aria-label="Dismiss">&times;</button>
</div>

<main id="view" class="view" aria-live="polite">
  <div class="loading">Loading league data…</div>
</main>

<nav class="tabbar" role="tablist">
  <button class="tab active" data-tab="home" role="tab" aria-selected="true">
    <svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>
    <span>Home</span>
  </button>
  <button class="tab" data-tab="teams" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg>
    <span>Teams</span>
  </button>
  <button class="tab" data-tab="players" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M12 3a4.2 4.2 0 1 1 0 8.4A4.2 4.2 0 0 1 12 3zm0 10c4.4 0 8 2.2 8 5v3H4v-3c0-2.8 3.6-5 8-5z"/></svg>
    <span>Players</span>
  </button>
  <button class="tab" data-tab="freeagents" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M9 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm0 10c3.9 0 7 2 7 4.5V20H2v-2.5C2 15 5.1 13 9 13zm10-6h3v2h-3v3h-2V9h-3V7h3V4h2z"/></svg>
    <span><span class="tl">Free Agents</span><span class="ts">FA</span></span>
  </button>
  <button class="tab" data-tab="standings" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M4 5h16v3H4zm0 5.5h16v3H4zM4 16h16v3H4z"/></svg>
    <span><span class="tl">Standings</span><span class="ts">Stand.</span></span>
  </button>
  <button class="tab" data-tab="rankings" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M5 20V10h4v10H5zm5 0V4h4v16h-4zm5 0v-7h4v7h-4z"/></svg>
    <span><span class="tl">Rankings</span><span class="ts">Ranks</span></span>
  </button>
  <button class="tab" data-tab="leaders" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 14.3 7.2 16.9l.9-5.4L4.2 7.7l5.4-.8z"/></svg>
    <span>Leaders</span>
  </button>
  <button class="tab" data-tab="news" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M4 4h13v12.5a3.5 3.5 0 0 1-3.5 3.5H4zM19 8h1a1 1 0 0 1 1 1v7.5a3.5 3.5 0 0 1-3.5 3.5H17zM6.5 7.5h8v2h-8zm0 4h8v1.6h-8zm0 3.4h5.5v1.6H6.5z"/></svg>
    <span>News</span>
  </button>
  <button class="tab" data-tab="trade" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M7 4l-5 4.5L7 13v-3h9V7.5H7zM17 11v3H8v2.5h9V20l5-4.5z"/></svg>
    <span>Trade</span>
  </button>
</nav>

<script src="app.js"></script>
</body>
</html>
